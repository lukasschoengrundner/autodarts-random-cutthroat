name: Random Cutthroat UI CSS cleanup

on:
  push:
    paths:
      - '.github/workflows/ui-v03-css-fix.yml'

permissions:
  contents: write

jobs:
  fix-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fix dynamic class selectors
        run: python -c 'from pathlib import Path; p=Path("autodarts-random-cutthroat.user.js"); s=p.read_text(); p.write_text(s.replace(". ${APP_ID}-", ".${APP_ID}-"))'
      - name: Syntax check
        run: npm run check
      - name: Regression tests
        run: npm test
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add autodarts-random-cutthroat.user.js
          git commit -m "Fix UI class selectors"
          git push

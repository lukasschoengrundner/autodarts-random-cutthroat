name: Random Cutthroat UI v0.3 one-shot

on:
  push:
    paths:
      - '.github/workflows/ui-v03-one-shot.yml'

permissions:
  contents: write

jobs:
  refresh-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply UI refresh
        run: python scripts/ui-v03-patch.py
      - name: Syntax check
        run: npm run check
      - name: Regression tests
        run: npm test
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add autodarts-random-cutthroat.user.js package.json CHANGELOG.md README.md
          git commit -m "Refresh Random Cutthroat interface for TV"
          git push
